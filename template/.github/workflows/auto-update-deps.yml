name: Auto Update Dependencies

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install copier
        run: |
          python -m pip install --upgrade pip
          pip install copier

      # requirements*.txt, .pre-commit-config.yaml, and this workflow itself are all template
      # payload kept fresh upstream (see the minimal-cli template repo's own deps-update.yml) --
      # this just pulls that already-vetted content forward.
      - name: Pull template updates
        run: copier update --defaults --skip-answered

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update from template'
          title: 'chore(deps): weekly dependency updates'
          body: |
            This automated PR pulls the latest template updates via `copier update`, including
            refreshed `requirements.txt`/`requirements-dev.txt`, `.pre-commit-config.yaml`, and
            any other template improvements.

            A `copier update` merge conflict may leave conflict markers in the diff below --
            resolve them before merging.
          branch: chore/auto-update-deps
          labels: dependencies, automated
          signoff: false

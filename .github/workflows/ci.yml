name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Trufflehog runs as a standalone CI step because there's no maintained
      # pre-commit hook available for it
      - name: Run Trufflehog secret scanner
        uses: trufflesecurity/trufflehog@v3.99.3
        with:
          path: .

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Runs here (rather than in the pre-commit hook set) so local pre-commit stays fast;
      # the pip-audit pre-commit hook is deferred to the pre-push stage for the same reason.
      - name: Run pip-audit dependency vulnerability scanner
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements-dev.txt

      # Runs here (rather than in the pre-commit hook set) so local pre-commit stays fast;
      # the checkov pre-commit hook is deferred to the pre-push stage for the same reason.
      # Only the root workflows are scanned here; template/.github/workflows/*.yml are
      # verbatim copies already covered by this same job in generated projects' own CI.
      - name: Run checkov IaC security scanner
        run: |
          python -m pip install --upgrade pip
          pip install checkov==3.3.16
          checkov --framework github_actions -d .github/workflows

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache tox environments
        uses: actions/cache@v6
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements-dev.txt', '.pre-commit-config.yaml') }}
          restore-keys: |
            tox-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Run tests
        run: tox
